[project]
name = "researchlens-query-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "qdrant-client>=1.9",
  "rank-bm25>=0.2",
  "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["..", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
